<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="icon" type="image/x-icon" href="https://thatopen.github.io/engine_components/resources/favicon.ico">
  <title>1. Viewpoint JSON camera is Y-up</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      overflow: hidden;
      background: #1d2733;
    }

    /* Two worlds side by side, left of the panel */
    .views {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      width: calc(100vw - 25rem);
      height: 100vh;
    }

    .view {
      position: relative;
      overflow: hidden;
    }

    .view-title {
      position: absolute;
      z-index: 2;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      color: #fff;
      pointer-events: none;
    }

    .view-title.expected {
      background: #2a8a3e;
    }

    .view-title.thatopen {
      background: #c0392b;
    }

    .scene-label {
      font: 600 12px sans-serif;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff;
      white-space: nowrap;
    }

    .options-menu {
      position: fixed;
      min-width: unset;
      width: 24rem;
      top: 5px;
      right: 5px;
      height: fit-content;
      max-height: calc(100vh - 10px);
    }

    .phone-menu-toggler {
      visibility: hidden;
    }

    @media (max-width: 480px) {
      .views {
        width: 100vw;
      }

      .options-menu {
        visibility: hidden;
        bottom: 5px;
        left: 5px;
      }

      .options-menu-visible {
        visibility: visible;
      }

      .phone-menu-toggler {
        visibility: visible;
        position: fixed;
        top: 5px;
        right: 5px;
      }
    }

    .views.single {
      grid-template-columns: 1fr;
    }
  </style>
</head>

<body>
  <div class="views">
    <div class="view" id="expected"><div class="view-title expected">Expected (BCF)</div></div>
    <div class="view" id="thatopen"><div class="view-title thatopen">That Open 3.6.0</div></div>
  </div>
  <script type="module" src="./example.ts"></script>
</body>

</html>
